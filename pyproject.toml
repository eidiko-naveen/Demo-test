[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-platform"
version = "0.1.0"
description = "Modular enterprise RAG and multi-agent conversational AI platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "aiosqlite>=0.20,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40,<2.0"]
rag = [
    "langchain>=0.3,<2.0",
    "langgraph>=0.2,<2.0",
    "langchain-groq>=0.2,<1.0",
    "langchain-huggingface>=0.1,<1.0",
    "sentence-transformers>=3.0,<6.0",
    "qdrant-client>=1.12,<2.0",
    "pypdf>=5.0,<7.0",
    "python-docx>=1.1,<2.0",
]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.6,<1.0",
]
migrations = ["alembic>=1.13,<2.0"]

[tool.setuptools.packages.find]
include = ["app*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
