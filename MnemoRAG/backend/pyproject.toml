[project]
name = "mnemorag-backend"
version = "0.1.0"
description = "MnemoRAG backend — RAG chatbot with pluggable memory modes"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "groq>=0.11.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "fastembed>=0.4.1",
    "tenacity>=9.0.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"