# ============================================================
# EIDIKO Internal Assistant — Namespace, Service, OCP Route
# Controls: C11, C12, C23
#
# Application Metadata (DevOps requirement):
#   app-name        : EIDIKO Internal Assistant
#   app-owner       : Sumith
#   business-criticality: High (P2)
# ============================================================

---
apiVersion: v1
kind: Namespace
metadata:
  name: eidiko
  labels:
    app: eidiko-chatbot
    # ── DevOps Required Metadata ──────────────────────────
    app-name: "EIDIKO-Internal-Assistant"
    app-owner: "Sumith"
    business-criticality: "High-P2"
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    app-name: "EIDIKO Internal Assistant"
    app-owner: "Sumith"
    business-criticality: "High (P2)"

---
apiVersion: v1
kind: Service
metadata:
  name: eidiko-chatbot
  namespace: eidiko
  labels:
    app: eidiko-chatbot
    # ── DevOps Required Metadata ──────────────────────────
    app-name: "EIDIKO-Internal-Assistant"
    app-owner: "Sumith"
    business-criticality: "High-P2"
  annotations:
    app-name: "EIDIKO Internal Assistant"
    app-owner: "Sumith"
    business-criticality: "High (P2)"
spec:
  selector:
    app: eidiko-chatbot
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
  type: ClusterIP

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: eidiko-chatbot
  namespace: eidiko
  labels:
    app: eidiko-chatbot
    # ── DevOps Required Metadata ──────────────────────────
    app-name: "EIDIKO-Internal-Assistant"
    app-owner: "Sumith"
    business-criticality: "High-P2"
  annotations:
    app-name: "EIDIKO Internal Assistant"
    app-owner: "Sumith"
    business-criticality: "High (P2)"
spec:
  to:
    kind: Service
    name: eidiko-chatbot
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
