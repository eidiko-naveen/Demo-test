# ============================================================
# EIDIKO Internal Assistant — Kubernetes Secret
# Controls: C07, C08, C09
#
# Application Metadata (DevOps requirement):
#   app-name        : EIDIKO Internal Assistant
#   app-owner       : Sumith
#   business-criticality: High (P2)
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: eidiko-secrets
  namespace: eidiko
  labels:
    app: eidiko-chatbot
    component: secrets
    # ── DevOps Required Metadata ──────────────────────────
    app-name: "EIDIKO-Internal-Assistant"
    app-owner: "Sumith"
    business-criticality: "High-P2"
  annotations:
    app-name: "EIDIKO Internal Assistant"
    app-owner: "Sumith"
    business-criticality: "High (P2)"
type: Opaque
stringData:
  anthropic-api-key: "REPLACE_WITH_REAL_KEY"
  flask-secret-key: "REPLACE_WITH_RANDOM_32_BYTE_HEX"
  google-credentials-json: |
    {
      "installed": {
        "client_id": "REPLACE",
        "client_secret": "REPLACE",
        "redirect_uris": ["http://localhost"],
        "auth_uri": "https://accounts.google.com/o/oauth2/auth",
        "token_uri": "https://oauth2.googleapis.com/token"
      }
    }
