apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ include "eidiko-chatbot.fullname" . }}-config
  labels:
    {{- include "eidiko-chatbot.labels" . | nindent 4 }}

data:
  PORT: {{ .Values.config.PORT | quote }}
  HOST: {{ .Values.config.HOST | quote }}

  FLASK_DEBUG: {{ .Values.config.FLASK_DEBUG | quote }}

  PYTHONUNBUFFERED: {{ .Values.config.PYTHONUNBUFFERED | quote }}
  PYTHONDONTWRITEBYTECODE: {{ .Values.config.PYTHONDONTWRITEBYTECODE | quote }}

  GOOGLE_CREDENTIALS_FILE: {{ .Values.config.GOOGLE_CREDENTIALS_FILE | quote }}

  TOKEN_FILE: {{ .Values.config.TOKEN_FILE | quote }}
