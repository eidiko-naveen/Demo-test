# ============================================================
# EIDIKO CHATBOT - HELM VALUES
# ============================================================

replicaCount: 1


# ============================================================
# C07 - Image stored in approved registry
# ============================================================

image:
  repository: naveeneidiko/eidiko-chatbot
  tag: "1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []


# ============================================================
# C14 - Application port
# ============================================================

containerPort: 5000


# ============================================================
# Service
# ============================================================

service:
  type: ClusterIP

  # External/service port
  port: 5000

  # Container port
  targetPort: http


# ============================================================
# C13 - ConfigMap configuration
# ============================================================

config:

  # C12 - Environment variable
  PORT: "5000"

  HOST: "0.0.0.0"

  FLASK_DEBUG: "false"

  PYTHONUNBUFFERED: "1"

  PYTHONDONTWRITEBYTECODE: "1"

  GOOGLE_CREDENTIALS_FILE: "/etc/eidiko/google/credentials.json"

  TOKEN_FILE: "/data/token.json"


# ============================================================
# C11 - Kubernetes/OpenShift Secret
#
# Real credentials MUST NOT be stored in values.yaml.
#
# Create this Secret separately:
#
# eidiko-chatbot-secret
#
# with key:
#
# ANTHROPIC_API_KEY
# ============================================================

secret:

  create: false

  existingSecret: eidiko-chatbot-secret


# ============================================================
# OpenShift Route
# ============================================================

route:

  enabled: true

  # Empty = OpenShift generates hostname
  host: ""

  tls:
    enabled: true


# ============================================================
# C19 - CPU request
# C20 - Memory request
# C21 - CPU limit
# C22 - Memory limit
# ============================================================

resources:

  requests:
    cpu: "250m"
    memory: "256Mi"

  limits:
    cpu: "500m"
    memory: "512Mi"


# ============================================================
# C16 - Liveness probe
# C17 - Readiness probe
# C18 - Startup probe
# ============================================================

probes:

  liveness:

    enabled: true

    path: /

    port: http

    initialDelaySeconds: 30

    periodSeconds: 20

    timeoutSeconds: 5

    failureThreshold: 3


  readiness:

    enabled: true

    path: /

    port: http

    initialDelaySeconds: 10

    periodSeconds: 10

    timeoutSeconds: 5

    failureThreshold: 3


  startup:

    enabled: true

    path: /

    port: http

    periodSeconds: 10

    timeoutSeconds: 5

    failureThreshold: 30


# ============================================================
# C08 - Non-root / OpenShift arbitrary UID
#
# Do NOT specify runAsUser.
#
# OpenShift assigns the arbitrary UID.
# ============================================================

podSecurityContext:

  runAsNonRoot: true

  seccompProfile:
    type: RuntimeDefault


# ============================================================
# C09 - Container security
# ============================================================

containerSecurityContext:

  allowPrivilegeEscalation: false

  privileged: false

  capabilities:
    drop:
      - ALL

  seccompProfile:
    type: RuntimeDefault


# ============================================================
# C23 - Persistent storage
#
# Application is stateless.
# Persistent storage is NOT required.
# ============================================================

persistence:

  enabled: false

  storageClass: ""

  accessMode: ReadWriteOnce

  size: 5Gi

  mountPath: /data
