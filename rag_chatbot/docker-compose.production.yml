services:
  volume-permissions:
    image: alpine:3.20
    command: ["sh", "-c", "chown -R 65534:65534 /var/lib/rag/data"]
    volumes:
      - upload_data:/var/lib/rag/data
    restart: "no"
  app:
    build: .
    user: "${CONTAINER_UID:-1001}"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY}
      DATA_DIR: /var/lib/rag/data
      STREAMLIT_SERVER_PORT: ${APP_PORT:-8501}
    ports:
      - "127.0.0.1:${APP_PORT:-8501}:${APP_PORT:-8501}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    tmpfs:
      - /tmp
    volumes:
      - upload_data:/var/lib/rag/data
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      volume-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
  qdrant:
    image: qdrant/qdrant:v1.14.1
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY}
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
  upload_data: