apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-rag
  labels:
    app.kubernetes.io/name: enterprise-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: enterprise-rag
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enterprise-rag
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: enterprise-rag-chatbot:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8501
              protocol: TCP
          envFrom:
            - configMapRef:
                name: enterprise-rag-config
            - secretRef:
                name: enterprise-rag-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: app-data
              mountPath: /var/lib/rag
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /_stcore/health
              port: http
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: enterprise-rag-data
        - name: tmp
          emptyDir: {}
