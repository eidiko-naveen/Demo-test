apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocp-monitor-dashboard
  namespace: ocp-monitor
  labels:
    app.kubernetes.io/name: ocp-monitor
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ocp-monitor
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ocp-monitor
        app.kubernetes.io/component: dashboard
    spec:
      serviceAccountName: ocp-monitor
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: ocp-monitor:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["python", "run_streamlit.py"]
          envFrom:
            - configMapRef:
                name: ocp-monitor-config
            - secretRef:
                name: ocp-monitor-secrets
          env:
            - name: HOME
              value: /tmp
          ports:
            - name: http
              containerPort: 8501
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: runtime
              mountPath: /tmp
      volumes:
        - name: runtime
          emptyDir:
            sizeLimit: 256Mi
